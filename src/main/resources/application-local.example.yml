# application-local.yml로 복사해서 쓰세요 (application-local.yml은 커밋하지 않아요).
# 값은 .env 또는 셸 환경 변수에서 읽어요.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reeltrip?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:reeltrip}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
