# 공통 설정. 프로필별 값은 application-local.yml / application-prod.yml
spring:
  application:
    name: reeltrip
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    # FE 배포 주소·Vercel 미리보기 주소는 환경 변수로 (쉼표로 여러 개)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    local-origin: http://localhost:5173
  share:
    # 공유 주소 앞부분: {base-url}/plan/{planId}
    base-url: ${SHARE_BASE_URL:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3-flash-preview}
    timeout-seconds: 40
