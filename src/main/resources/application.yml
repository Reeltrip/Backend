# 공통 설정. 프로필별 값은 application-local.yml / application-prod.yml
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: reeltrip
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  analysis:
    enabled: ${ANALYSIS_ENABLED:true}
    link-timeout: PT90S
  maps:
    # 2026-11-15 BE 2 결정: AI는 주소·좌표를 만들지 않아서, 보강을 끄면 링크로 만든 장소 카드를 저장할 수 없어요.
    # 기본은 켜고, Google 정책 문제로 꺼야 하면 MAPS_PERSIST_ENRICHMENT=false (docs/places-enrichment.md).
    persist-enrichment: ${MAPS_PERSIST_ENRICHMENT:true}
  auth:
    dev-login:
      enabled: ${DEV_LOGIN_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    # FE 배포 주소·Vercel 미리보기 주소는 환경 변수로 (쉼표로 여러 개)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    local-origin: http://localhost:5173
  share:
    # 공유 주소 앞부분: {base-url}/plan/{planId}
    base-url: ${SHARE_BASE_URL:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3-flash-preview}
    timeout-seconds: 40
